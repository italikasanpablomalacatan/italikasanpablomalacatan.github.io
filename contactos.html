<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contactos y Agencias · Italika</title>

<link rel="icon" type="image/png" href="assets/img/logo-malacatan.png">

<link rel="stylesheet" href="styles.css?v=24">
</head>
<body>

<section class="agenciesView">
  <div class="agenciesTop">
    <a href="index.html" class="backBtn">← Volver al catálogo</a>
  </div>
  <div class="agenciesIntro">
    <span class="sectionEyebrow">Contáctanos</span>
    <h1>Nuestras Agencias</h1>
    <p class="muted">Elige tu agencia más cercana para hablar directamente con un asesor por WhatsApp o ver la ubicación en el mapa.</p>
  </div>

  <div class="agencyCardsWrap" id="agencyCardsWrap"></div>

  <a href="index.html" class="backBtn wide">← Volver al catálogo</a>
</section>

<script src="data.js?v=24"></script>
<script>
function openWaAgencia(key){
  const a=agencias[key];
  const tel=getAgencyPhone(key);
  const msg=encodeURIComponent('Hola, quiero información sobre motocicletas Italika.\nAgencia: '+a.nombre);
  window.open(`https://wa.me/${tel}?text=${msg}`,'_blank');
}

function buildAgencyCards(){
  const wrap=document.querySelector("#agencyCardsWrap");
  const logos={malacatan:"assets/img/logo-malacatan.png",sanpablo:"assets/img/logo-sanpablo.png"};
  wrap.innerHTML=Object.keys(agencias).map(key=>{
    const a=agencias[key];
    const telText=a.telefonos.length>1?"Te atendemos por cualquiera de nuestros números":("☎ "+a.telefonos[0]);
    return `<article class="agencyInfoCard">
      <div class="agencyLogoWrap"><img src="${logos[key]||''}" alt="Italika ${a.nombre}"></div>
      <h2>Italika ${a.nombre}</h2>
      <p class="agencyAddress">📍 ${a.direccion||''}</p>
      <p class="agencyPhone">${telText}</p>
      <div class="agencyActions">
        ${a.mapsUrl?`<a class="agencyBtn maps" href="${a.mapsUrl}" target="_blank" rel="noopener">Ver ubicación</a>`:''}
        <button class="agencyBtn wa" data-wa-key="${key}">Escribir por WhatsApp</button>
      </div>
    </article>`;
  }).join("");
  wrap.querySelectorAll("[data-wa-key]").forEach(b=>b.onclick=()=>openWaAgencia(b.dataset.waKey));
}

buildAgencyCards();
</script>

<footer>© 2026 Italika Malacatán</footer>
</body>
</html>
